<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reef Lab — Balling y química de arrecife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Modernist — tokens de _ds/modernist/styles.css del proyecto de diseño.
   Plano, Archivo, rojo casi mono, radio 0, reglas de 2 px, todo a la izquierda.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --ink:#201e1d; --accent:#ec3013;
  --divider:rgba(32,30,29,.4); --rule:rgba(32,30,29,.18);
  --n200:#eae7e7; --n300:#d7d3d3; --n400:#bab6b6; --n500:#9b9797;
  --n600:#7d7979; --n700:#605d5d; --n800:#444141; --n900:#2d2b2b;
  --acc100:#fff2ef; --acc600:#dd2b0f; --acc700:#ae1800;
  --shadow-lg:0 12px 32px rgba(45,43,43,.22);
  --font:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:48px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:800;line-height:1.12;letter-spacing:-.015em}
button{font:inherit;cursor:pointer;border-radius:0}
input,select,textarea{font:inherit;border-radius:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(236,48,19,.3)}
a{color:var(--accent)}
sup.norm{font-size:9px;color:var(--acc700);font-weight:800;margin-left:1px}

/* retícula visible */
.gr{display:grid;gap:2px;background:var(--divider)}
.gr>*{background:var(--bg)}
.gr.box{border:2px solid var(--divider)}
.gr-2{grid-template-columns:repeat(2,1fr)}
.gr-3{grid-template-columns:repeat(3,1fr)}
.gr-4{grid-template-columns:repeat(4,1fr)}
.gr-5{grid-template-columns:repeat(5,1fr)}
.gr-6{grid-template-columns:repeat(6,1fr)}
.wrap{max-width:1376px;margin:0 auto}
.mx{margin-left:var(--pad);margin-right:var(--pad)}
.spacer{flex:1}

/* barra superior */
.nav{display:flex;align-items:center;gap:32px;padding:20px var(--pad);border-bottom:2px solid var(--divider);position:sticky;top:0;z-index:40;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
.brand b{font-weight:800;font-size:20px;letter-spacing:-.015em}
.brand i{width:10px;height:10px;background:var(--accent);display:block}
.tabs{display:flex;gap:22px;font-size:13px;font-weight:600;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--n700);padding:0 0 3px;white-space:nowrap;font-weight:600}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* botones */
.btn{font-family:var(--font);font-weight:800;font-size:13px;line-height:1.2;padding:9px 14px;border:2px solid var(--divider);background:transparent;color:var(--ink);text-align:left}
.btn:hover{background:rgba(32,30,29,.07)}
.btn:active{background:rgba(32,30,29,.14)}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-size:14px;padding:8px 16px}
.btn-primary:hover{background:var(--acc600);border-color:var(--acc600)}
.btn-danger{border-color:var(--accent);color:var(--acc700)}
.btn-danger:hover{background:var(--acc100)}
.btn-sm{font-size:11.5px;padding:7px 11px;letter-spacing:.04em}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:800;font-size:12px}
.lnk:hover{color:var(--acc700);text-decoration:underline;text-underline-offset:3px}

/* tipografía */
.h-sec{font-size:25px;font-weight:800;letter-spacing:-.015em;text-transform:uppercase}
.h-sub{font-size:21px;font-weight:800;letter-spacing:-.015em;text-transform:uppercase}
.kicker{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--n700)}
.kicker.acc{color:var(--acc700)}
.meta{font-size:12px;font-weight:600;color:var(--n700)}
.meta.bad,.bad{color:var(--acc700)}
.dim{color:var(--n500)}
.tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.row.c{align-items:center}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--acc100);color:var(--acc700);padding:2px 7px}

/* celdas de dato */
.stat{padding:18px 24px}
.stat .v{font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n700);margin-top:6px}
.stat.sm .v{font-size:28px}
.tank{font-size:clamp(32px,5.6vw,50px);line-height:1.02;letter-spacing:-.025em;font-weight:800;margin-top:12px;text-transform:uppercase}

/* nota con filo */
.note{border-left:4px solid var(--divider);padding:2px 0 2px 14px}
.note.acc{border-left-color:var(--accent)}
.note .t{font-size:14px;margin-top:4px;text-wrap:pretty}
.note.tight .t{margin-top:0}

/* selector segmentado */
.seg{display:flex;flex-wrap:wrap;gap:2px;width:fit-content;max-width:100%;background:var(--divider);border:2px solid var(--divider)}
.seg button{background:var(--bg);color:var(--n700);border:0;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px}
.seg button:hover{background:rgba(32,30,29,.07)}
.seg button.on{background:var(--accent);color:var(--bg)}
.ulinks{display:flex;gap:18px;flex-wrap:wrap}
.ulinks button{background:none;border:0;border-bottom:2px solid transparent;padding:0 0 2px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--n700)}
.ulinks button:hover{color:var(--ink)}
.ulinks button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* parámetros */
.pcell{padding:16px}
.pcell .top{display:flex;align-items:center;gap:6px}
.pcell .sq{width:8px;height:8px;background:var(--ink);display:block;flex:0 0 auto}
.pcell .sq.bad{background:var(--accent)}
.pcell .nm{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n700)}
.pcell .nm.bad{color:var(--acc700)}
.pcell .val{display:flex;align-items:baseline;gap:4px;margin-top:10px}
.pcell .val b{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pcell .val span{font-size:12px;font-weight:600;color:var(--n600)}
.pcell .dlt{font-size:12px;font-weight:600;color:var(--n600);margin-top:4px}
.pcell .dlt.bad{color:var(--acc700)}
.pcell .obj{font-size:11px;font-weight:600;color:var(--n500);margin-top:8px;font-variant-numeric:tabular-nums}
.pcell svg{width:100%;height:28px;display:block;margin-top:12px}

/* avisos */
.avisos{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--divider)}
.aviso{background:var(--bg);border-left:4px solid var(--divider);padding:0 16px 0 14px}
.aviso.bad{border-left-color:var(--accent)}
.aviso.ok{border-left-color:var(--n400)}
.aviso.fill{border-left-color:transparent}
.aviso .t{font-size:15px;font-weight:800}
.aviso .d{font-size:13px;color:var(--n700);margin-top:4px;text-wrap:pretty}

/* plan */
.plan-fila{display:grid;grid-template-columns:88px 1fr 92px 1.3fr;gap:12px;padding:14px 18px;border-top:1px solid var(--rule);align-items:baseline}
.plan-fila:first-of-type{border-top:0}
.plan-fila .hora{font-size:15px;font-weight:800}
.plan-fila .qué{font-size:15px;font-weight:800}
.plan-fila .cuánto{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.plan-fila .det{font-size:12.5px;color:var(--n700)}
.plan-fila.dia .hora{color:var(--n700);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.plan-nota{border-top:1px solid var(--rule);padding:14px 18px;font-size:13.5px;color:var(--n700);text-wrap:pretty;background:rgba(32,30,29,.03)}

/* soluciones */
.solc{background:var(--bg);padding:18px}
.solc .nm{font-size:16px;font-weight:800}
.solc .sp{font-size:12.5px;color:var(--n600)}
.tipo{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--n700)}
.pasos{margin:14px 0 0;padding-left:22px;font-size:14px}
.pasos li{margin-bottom:12px;text-wrap:pretty}
.pasos li::marker{font-weight:800;color:var(--accent)}

/* corales */
.ccard{background:var(--bg);padding:14px;border:0;text-align:left;color:inherit;display:block;width:100%;font:inherit;cursor:pointer}
.ccard:hover{background:rgba(32,30,29,.05)}
.ph{aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;background:repeating-linear-gradient(135deg,var(--n300) 0 6px,var(--n400) 6px 12px)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--n800)}
.ccard .nm{font-size:15px;font-weight:800}
.ccard .sp{font-size:12.5px;color:var(--n600)}
.ccard .ft{display:flex;align-items:baseline;gap:10px;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ccard.lost{opacity:.5}

/* tablas */
.tbl-box{border:2px solid var(--divider);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
thead th{background:var(--ink);color:var(--bg);text-align:left;white-space:nowrap;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:9px 12px}
td{padding:10px 12px;border-top:1px solid var(--rule);text-align:left;vertical-align:top}
td.k{font-weight:800;white-space:nowrap}
td.oo{color:var(--acc700);font-weight:800}
tbody tr:hover{background:rgba(32,30,29,.04)}
td .lnk{font-size:12px}
input.mini{max-width:110px;padding:5px 8px;border-width:1px}

/* formularios */
.field{margin-bottom:16px}
.field>label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n700);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--surface);color:var(--ink);border:2px solid var(--divider);
  padding:9px 12px;font-size:14px;font-variant-numeric:tabular-nums;caret-color:var(--accent)}
input:hover,select:hover,textarea:hover{border-color:rgba(32,30,29,.55)}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--accent);outline:none}
input:disabled{opacity:.55}
textarea{min-height:76px;resize:vertical;font-variant-numeric:normal}
input[type=file]{font-size:12px;color:var(--n700);font-family:var(--mono)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 16px}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;cursor:pointer;margin-top:4px}
.check input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent);margin-top:2px}
details.det-kits{border-top:2px solid var(--divider);padding-top:14px}
details.det-kits summary{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n700);cursor:pointer}
details.det-kits summary:hover{color:var(--ink)}

/* calculadoras */
.calc{padding:28px 32px 32px}
.calc-h{display:flex;align-items:baseline;gap:10px;margin-bottom:20px}
.calc-h .n{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--acc700)}
.out{border-top:2px solid var(--divider);padding-top:18px;margin-top:20px}
.out .big{font-size:clamp(34px,4.4vw,52px);font-weight:800;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mid{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.out .sub,.sub{font-size:14px;color:var(--n700);margin-top:6px;text-wrap:pretty}
.sub b{color:var(--ink)}
.bar{height:14px;border:2px solid var(--divider);margin-top:8px;display:flex}
.bar i{display:block;background:var(--accent)}

/* bitácora de coral */
.tl-item{border-top:1px solid var(--rule);padding:14px 0}
.tl-item:first-child{border-top:0}
.tl-d{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n700)}
.tl-t{font-size:14px;margin-top:6px;white-space:pre-wrap;text-wrap:pretty}
.tl-img{margin-top:10px;max-width:220px;width:100%;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--divider);border:2px solid var(--divider)}
.cmp figure{margin:0;background:var(--bg);padding:12px}
.cmp img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.cmp figcaption{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--n700);margin-top:8px}

/* modal */
.backdrop{position:fixed;inset:0;z-index:100;display:none;background:rgba(45,43,43,.5);padding:32px 16px;overflow-y:auto}
.backdrop.on{display:block}
.dialog{max-width:620px;margin:0 auto;background:var(--bg);border:2px solid var(--divider);box-shadow:var(--shadow-lg)}
.dialog.wide{max-width:920px}
.dialog-h{display:flex;align-items:center;gap:16px;padding:18px 24px;border-bottom:2px solid var(--divider);position:sticky;top:0;background:var(--bg);z-index:2}
.dialog-h h3{font-size:21px;text-transform:uppercase;flex:1}
.dialog-b{padding:24px}
.dialog-f{display:flex;gap:8px;justify-content:flex-end;padding:0 24px 24px}
.x{background:none;border:0;font-size:18px;font-weight:800;color:var(--n700);padding:2px 8px}
.x:hover{color:var(--accent)}

/* puerta de acceso */
.gate{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:var(--bg);padding:24px}
.gate.on{display:grid}
.gate-box{max-width:460px;width:100%;border:2px solid var(--divider);padding:36px 32px}
.gate .brand{margin-bottom:28px}
.gate-t{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-transform:uppercase}
.gate-d{font-size:14px;color:var(--n700);margin-top:12px;text-wrap:pretty}
.gate-btn{margin-top:24px}
.sync{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--n500);white-space:nowrap}
.sync.guardando{color:var(--n700)}
.sync.guardado{color:var(--n500)}
.sync.error{color:var(--acc700)}
#usuario{display:flex;align-items:baseline;gap:10px;white-space:nowrap}

.empty{border:2px dashed var(--divider);padding:36px 24px;color:var(--n600);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.view{display:none}
.view.on{display:block}
.sec{padding:28px var(--pad) 0}
.sec.last{padding-bottom:40px}
.band{border-bottom:2px solid var(--divider)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;z-index:200;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}

@media(max-width:1100px){
  :root{--pad:24px}
  .gr-5{grid-template-columns:repeat(3,1fr)}
  .gr-6{grid-template-columns:repeat(4,1fr)}
  /* fuera de su retícula nativa el relleno estorba: separación simple */
  .gr-3{grid-template-columns:repeat(2,1fr);gap:20px;background:none}
  .gr-3.box{border:0}
  .gr-3>.solc{border:2px solid var(--divider)}
  .solc.fill{display:none}
  .avisos{grid-template-columns:repeat(2,1fr);gap:20px;background:none}
  .aviso.fill{display:none}
  .plan-fila{grid-template-columns:76px 1fr 84px;gap:10px}
  .plan-fila .det{grid-column:2/-1;margin-top:-4px}
}
@media(max-width:760px){
  :root{--pad:16px}
  .nav{gap:14px;padding:14px var(--pad);flex-wrap:wrap}
  .nav .btn-primary,.nav .meta{order:3}
  .tabs{order:4;width:100%;gap:18px}
  .gr-5,.gr-4,.gr-6,.gr-3{grid-template-columns:repeat(2,1fr)}
  .gr-2{grid-template-columns:1fr}
  .gr-2.gr-stats{grid-template-columns:1fr 1fr}
  .stat{padding:14px 16px}
  .stat .v{font-size:26px}
  .avisos{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr !important}
  .f2,.f3,.f4{grid-template-columns:1fr 1fr}
  .h-sec{font-size:21px}
  .cmp{grid-template-columns:1fr}
  .calc{padding:22px var(--pad) 26px}
  .plan-fila{grid-template-columns:70px 1fr 78px}
}
</style>
</head>
<body>

<header class="nav">
  <div class="brand"><b>REEF LAB</b><i></i></div>
  <nav class="tabs" id="tabs">
    <button data-tab="panel" class="on">Panel</button>
    <button data-tab="plan">Plan</button>
    <button data-tab="parametros">Parámetros</button>
    <button data-tab="soluciones">Soluciones</button>
    <button data-tab="corales">Corales</button>
    <button data-tab="mant">Mantenimiento</button>
    <button data-tab="calc">Calculadoras</button>
    <button data-tab="ajustes">Ajustes</button>
  </nav>
  <div class="spacer"></div>
  <span class="sync" id="syncEstado"></span>
  <span id="usuario"></span>
  <div id="navAction"></div>
</header>

<main class="wrap">
  <section class="view on" id="v-panel"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-parametros"></section>
  <section class="view" id="v-soluciones"></section>
  <section class="view" id="v-corales"></section>
  <section class="view" id="v-mant"></section>
  <section class="view" id="v-calc"></section>
  <section class="view" id="v-ajustes"></section>
</main>

<div class="backdrop" id="backdrop"><div class="dialog" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/quimica.js"></script>
<script src="js/graficas.js"></script>
<script src="js/db.js"></script>
<script src="js/v-plan.js"></script>
<script src="js/v-parametros.js"></script>
<script src="js/v-soluciones.js"></script>
<script src="js/v-otros.js"></script>
<script src="js/app.js"></script>
</body>
</html>
